<!doctype html>
<html lang="en" data-scraper-session>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scraper session</title>
</head>
<body>
    <main>
        <h1>Scraper session</h1>
        <p>This local session page is loaded by Playwright, without a web server.</p>
        <button id="notify" type="button">Test C# connection</button>
        <p id="status" role="status"></p>
        <h2>Visited URLs</h2>
        <p id="visits-status" role="status">Loading visited URLs...</p>
        <ol id="visited-urls"></ol>
    </main>
</body>
</html>
