<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scraper session</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 64px auto; padding: 0 24px; background: #f5f7fa; color: #172033; }
        main { background: white; padding: 32px; border-radius: 16px; }
        button { background: #2458d3; color: white; border: 0; border-radius: 8px; padding: 12px 20px; cursor: pointer; }
        #status { min-height: 24px; }
    </style>
</head>
<body>
    <main>
        <h1>Scraper session</h1>
        <p>This local session page is loaded by Playwright, without a web server.</p>
        <button id="notify" type="button">Test C# connection</button>
        <p id="status" role="status"></p>
    </main>
    <script>
        document.getElementById('notify').addEventListener('click', async () => {
            const status = document.getElementById('status');
            try {
                status.textContent = await window.notifyScraper('Hello from the session page!');
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
