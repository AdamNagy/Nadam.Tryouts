<!doctype html>
<html lang="en" data-scraper-session>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scraper session</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 64px auto; padding: 0 24px; background: #f5f7fa; color: #172033; }
        main { background: white; padding: 32px; border-radius: 16px; }
        button { background: #2458d3; color: white; border: 0; border-radius: 8px; padding: 12px 20px; cursor: pointer; }
        #status { min-height: 24px; }
        #visited-urls { padding-left: 24px; }
        #visited-urls li { margin: 8px 0; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main>
        <h1>Scraper session</h1>
        <p>This local session page is loaded by Playwright, without a web server.</p>
        <button id="notify" type="button">Test C# connection</button>
        <p id="status" role="status"></p>
        <h2>Visited URLs</h2>
        <p id="visits-status" role="status">Loading visited URLs...</p>
        <ol id="visited-urls"></ol>
    </main>
    <script>
        const visitedUrlsList = document.getElementById('visited-urls');
        const visitsStatus = document.getElementById('visits-status');
        let lastUrls = '';
        let refreshTimer;
        let stopped = false;

        async function refreshVisitedUrls() {
            try {
                const urls = await window.pocGetVisitedUrls();
                const serialized = JSON.stringify(urls);
                if (serialized !== lastUrls) {
                    const items = urls.map(url => {
                        const item = document.createElement('li');
                        item.textContent = url;
                        return item;
                    });
                    visitedUrlsList.replaceChildren(...items);
                    lastUrls = serialized;
                }
                visitsStatus.textContent = urls.length === 0 ? 'No visited URLs yet.' : `${urls.length} visits`;
            } catch (error) {
                visitsStatus.textContent = 'Could not load visited URLs: ' + error.message;
            } finally {
                if (!stopped) refreshTimer = setTimeout(refreshVisitedUrls, 1000);
            }
        }

        window.addEventListener('pagehide', () => {
            stopped = true;
            clearTimeout(refreshTimer);
        });
        refreshVisitedUrls();

        document.getElementById('notify').addEventListener('click', async () => {
            const status = document.getElementById('status');
            try {
                status.textContent = await window.notifyScraper('Hello from the session page!');
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
